[package]
name = "hydra-rgb"
version = "0.1.0"
edition = "2021"
description = "Desktop RGB controller for the Portronics Hydra 10"

[dependencies]
device_query = "4"
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.25.1", default-features = false }
